name: Build and deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JupyterLite
        # jupyter-server is required: `jupyter lite build --contents`
        # uses it to index the content files (without it the build
        # fails with "jupyter-server is not installed").
        run: pip install jupyterlite jupyter-server
      - name: Stage content
        run: |
          mkdir -p content
          cp -r bloodflow examples videos content/
          cp README.md demo.ipynb content/
          rm -rf content/examples/__pycache__ content/bloodflow/__pycache__
      - name: Build the JupyterLite site
        run: jupyter lite build --contents content --output-dir _output
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
